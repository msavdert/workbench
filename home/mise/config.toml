# ~/.config/mise/config.toml - shared base for both profiles (D6, D7).
# The profile delta lives next to it as config.<MISE_ENV>.toml; MISE_ENV is
# exported from ~/.config/workbench/env by home/install.sh <profile>.
#
# What belongs here: tools both the laptop and the box want. Runtimes, LSPs,
# kubernetes tooling and the long tail go to config.box.toml; the laptop is
# a client and stays short. `mise prune` removes anything no longer listed.
#
# Claude Code is not here on purpose: the box uses the native installer (D7);
# the laptop lists it in config.mac.toml.

[settings]
# Agents cannot answer y/n prompts.
yes = true
not_found_auto_install = false
npm.package_manager = "bun"
task.source_freshness_hash_contents = true

[tools]
# --- shell experience: home/zsh/.zshrc references these on both profiles ---
starship = "latest"
zoxide = "latest"
eza = "latest"
bat = "latest"
fzf = "latest"
usage = "latest" # required by `mise completion zsh`

# --- everyday CLI ---
gh = "latest"
jq = "latest"
yq = "latest"
ripgrep = "latest"
fd = "latest"
uv = "latest"
"1password-cli" = "latest"
shellcheck = "latest" # `make lint` in this repository
shfmt = "latest"

# --- AI harnesses (D12); omp is the npm package below ---
herdr = "latest"
agy = "latest"
# bun is the package manager of the npm backend (settings.npm.package_manager
# above); without it the omp install fails on a profile without node.
bun = "latest"
"npm:@oh-my-pi/pi-coding-agent" = "latest"

[tasks."completions:regen"]
description = "Regenerate the shell completion cache in ~/.local/share/zsh/completions"
run = "~/.config/zsh/regen-completions.zsh"

[tasks."zsh:plugins"]
description = "Clone or fast-forward zsh-autosuggestions and zsh-syntax-highlighting into ~/.local/share/zsh-plugins"
run = "~/.config/zsh/install-plugins.sh"

# herdr writes its hook scripts (~/.claude/hooks/herdr-agent-state.sh,
# ~/.omp/agent/extensions/, ~/.gemini/config/hooks.json) and appends its own
# SessionStart entry to ~/.claude/settings.json. That file is composed by
# home/install.sh, whose base already registers the same script behind an
# `[ -x ]` guard, so install.sh runs last to take the file back (herdr's
# duplicate entry goes, the hook keeps firing). ~/.gemini/config is created
# up front: herdr refuses without it and agy has not necessarily run yet on
# a fresh box (assumption: agy reads hooks.json from there, as on the mac).
# Claude Code plugins are declared in home/claude/settings.base.json under
# enabledPlugins ({"name@marketplace": true}; extraKnownMarketplaces for
# non-official sources) - key names verified against code.claude.com/docs
# on 2026-08-19. Declaring alone does not install (documented, and issue
# 32606), so this task installs whatever the composed settings enable.
# Nothing is enabled today; the task is the path when something is.
[tasks."claude:plugins"]
description = "claude plugin install for every plugin enabled in ~/.claude/settings.json"
run = """
jq -r '.enabledPlugins // {} | to_entries[] | select(.value) | .key' ~/.claude/settings.json |
  while read -r p; do claude plugin install --scope user "$p"; done
"""

[tasks."herdr:integrations"]
description = "Install herdr's hook scripts for claude, omp and agy, then re-run home/install.sh to keep settings.json composed"
run = """
set -euo pipefail
herdr integration install claude
herdr integration install omp
mkdir -p ~/.gemini/config
herdr integration install antigravity-cli
"${WORKBENCH_DIR:-$HOME/work/workbench}/home/install.sh" "$WORKBENCH_PROFILE"
"""
