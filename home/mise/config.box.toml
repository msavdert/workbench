# ~/.config/mise/config.box.toml - box delta (MISE_ENV=box).
# The long list: everything the code and the agents need. apt owns the OS
# layer (docker, build tools, diagnostics, tmux); this is the per-user,
# fast-moving layer that `mise up` refreshes at once (D7).
#
# Version policy: language runtimes are pinned to a major version because a
# silent major bump breaks virtualenvs, node_modules and compiled artifacts.
# CLI tools track latest.

[tools]
# --- language runtimes ---
python = "3.14"
node = "24"
go = "1.26"
java = "temurin-24"
rust = "latest"
cargo-binstall = "latest"

# --- editor and multiplexer (interactive only; config under home/nvim,
#     home/zellij; tmux itself is apt for agent-session) ---
neovim = "latest"
zellij = "latest"

# --- terminal utilities beyond the shared base ---
yazi = "latest"

# Neovim language servers and formatters. mason is disabled in
# home/nvim/lua/plugins/box.lua so these come from mise instead of being
# downloaded at runtime. Add a server here AND in that file.
lua-language-server = "latest"
stylua = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:tldr" = "latest"

# --- system and network ---
duf = "latest"
dust = "latest"
gping = "latest"
btop = "latest"

# --- version control ---
lazygit = "latest"
delta = "latest"

# --- cloud, kubernetes and infrastructure ---
aws-cli = "latest"
kubectl = "latest"
helm = "latest"
helmfile = "latest"
k9s = "latest"
talosctl = "latest"
cilium-cli = "latest"
argocd = "latest"
terraform = "latest"

# --- databases ---
usql = "latest"
"http:sqlcl" = { version = "26.2.0.181.2110", url = "https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-26.2.0.181.2110.zip" }

[tasks."kube:homelab"]
description = "Pull kubeconfig + talosconfig from 1Password into ~/.kube and ~/.talos"
run = """
mkdir -p ~/.kube ~/.talos
op read "op://dotfiles/texts/homelab-kubeconfig"  > ~/.kube/config
op read "op://dotfiles/texts/homelab-talosconfig" > ~/.talos/config
chmod 600 ~/.kube/config ~/.talos/config
"""

# Writes only to ~/.ssh/config.local, which configs/ssh/config Includes first
# and which this repo never tracks - the baked-in config is untouched. The
# managed block is fenced by markers so re-running replaces only what this
# task wrote last time and leaves anything you added by hand alone. Each
# private key goes straight into the running ssh-agent, nothing touches disk;
# the public key (not sensitive) is written per host and pinned with
# IdentityFile + IdentitiesOnly so ssh offers only that key for that host -
# with many keys loaded, offering all of them trips sshd's MaxAuthTries and
# the connection gets dropped as "too many authentication failures" before
# the right key is ever reached.
[tasks."ssh:sync"]
description = "Pull SSH hosts tagged ssh-host from 1Password into ~/.ssh/config.local and ssh-agent"
run = """
mkdir -p ~/.ssh && chmod 700 ~/.ssh
touch ~/.ssh/config.local
rm -rf ~/.ssh/1p-hosts && mkdir -p ~/.ssh/1p-hosts && chmod 700 ~/.ssh/1p-hosts

# mise tasks run under plain sh, not zsh, so .zshrc's agent bootstrap never
# fires here - this task needs to be able to stand on its own. Same self-heal
# as .zshrc: a dead agent leaves its socket file behind, so probe with
# ssh-add rather than trusting the file's existence.
AGENT_SOCK="${XDG_RUNTIME_DIR:-$HOME/.ssh}/ssh-agent.sock"
if [ -z "${SSH_AUTH_SOCK:-}" ] || [ "$SSH_AUTH_SOCK" = "$AGENT_SOCK" ]; then
    AGENT_RC=0
    SSH_AUTH_SOCK="$AGENT_SOCK" ssh-add -l >/dev/null 2>&1 || AGENT_RC=$?
    if [ "$AGENT_RC" = 2 ]; then
        rm -f "$AGENT_SOCK"
        eval "$(ssh-agent -s -a "$AGENT_SOCK")" >/dev/null
    fi
    export SSH_AUTH_SOCK="$AGENT_SOCK"
fi

BEGIN_MARK="# --- BEGIN op ssh:sync (managed, do not edit) ---"
END_MARK="# --- END op ssh:sync ---"

awk -v b="$BEGIN_MARK" -v e="$END_MARK" '
  $0 == b { skip = 1 }
  !skip   { print }
  $0 == e { skip = 0 }
' ~/.ssh/config.local > ~/.ssh/config.local.tmp

{
  cat ~/.ssh/config.local.tmp
  echo "$BEGIN_MARK"
  op item list --vault dotfiles --tags ssh-host --categories "SSH Key" --format json \
    | jq -r '.[].id' \
    | while read -r id; do
        item=$(op item get "$id" --vault dotfiles --format json)
        title=$(printf '%s' "$item" | jq -r '.title')
        host=$(printf '%s' "$item" | jq -r '[.fields[] | select(.label=="hostname") | .value] | first // empty')
        user=$(printf '%s' "$item" | jq -r '[.fields[] | select(.label=="user") | .value] | first // empty')
        port=$(printf '%s' "$item" | jq -r '[.fields[] | select(.label=="port") | .value] | first // "22"')
        [ -n "$host" ] || continue
        op read "op://dotfiles/$id/private key?ssh-format=openssh" | ssh-add -q -
        op read "op://dotfiles/$id/public key" > ~/.ssh/1p-hosts/"$title".pub
        printf 'Host %s\\n    HostName %s\\n    User %s\\n    Port %s\\n    IdentityFile ~/.ssh/1p-hosts/%s.pub\\n    IdentitiesOnly yes\\n\\n' \
          "$title" "$host" "$user" "$port" "$title"
      done
  echo "$END_MARK"
} > ~/.ssh/config.local.new

mv ~/.ssh/config.local.new ~/.ssh/config.local
rm -f ~/.ssh/config.local.tmp
chmod 600 ~/.ssh/config.local
printf 'Synced. ssh-agent now holds:\\n'
ssh-add -l || true
"""

# The `Synthetic` item is an API Credential in the `dotfiles` vault (created
# 2026-08-19; the Private-vault login item of the same name could not be moved,
# it has an SSO field op cannot copy). ~/.omp/agent/.env is
# part of OMP's native .env discovery chain, so the key never has to live in the
# shell environment. The anthropic and google-antigravity providers are OAuth
# backed and still need an interactive `/login` inside OMP - an OAuth session
# cannot be restored from a stored key.
[tasks."omp:auth"]
description = "Write the Synthetic API key from 1Password into ~/.omp/agent/.env"
run = """
set -eu
key="$(op read "op://dotfiles/Synthetic/credential")"
mkdir -p ~/.omp/agent
umask 077
printf 'SYNTHETIC_API_KEY=%s\\n' "$key" > ~/.omp/agent/.env
"""

