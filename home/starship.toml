# Starship prompt, shared by the mac and the box (one source per setting).
#
# Rendering context: Ghostty on the mac with JetBrainsMono Nerd Font
# (mac/Brewfile, mac/ghostty/config). The box is only ever reached from that
# same terminal over ssh, so Nerd Font glyphs are safe on both profiles.
# Profile differences come from starship's own context detection, not from
# per-machine files: hostname and username appear only over ssh or as root,
# language and cloud modules appear only inside a matching directory.
#
# The prompt is never rendered under TERM=dumb; home/zsh/.zshrc guards the
# `starship init` call so captured and agent-spawned shells stay plain.
#
# Schema: https://starship.rs/config/ - unknown keys are rejected.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
# git and language modules shell out; 500 ms (the default) is too tight on
# a large repo over ssh and surfaces as "timed out" warnings in the prompt.
command_timeout = 1000
scan_timeout = 30
palette = 'workbench'

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$terraform\
$python\
$nodejs\
$golang\
$rust\
$direnv\
$sudo\
$jobs\
$cmd_duration\
$line_break\
$character"""

right_format = """$status$time"""

continuation_prompt = '[... ](muted)'

# Named colours keep module styles readable and make a theme swap a one-place
# change. Values are the terminal's 16-colour palette so they follow Ghostty's
# theme instead of fighting it.
[palettes.workbench]
accent = 'blue'
ok = 'green'
warn = 'yellow'
err = 'red'
vcs = 'purple'
cloud = 'bright-blue'
muted = 'bright-black'

[os]
# Glyph only, and only when it carries information: the box is Ubuntu, the
# mac is macOS, so the symbol alone tells which side of the ssh hop you are on.
disabled = false
format = '[$symbol]($style) '
style = 'muted'

[os.symbols]
Macos = ' '
Ubuntu = ' '
Debian = ' '
Linux = ' '

[username]
# Shown only as root or over ssh (starship's default), styled to stand out
# when it is root.
format = '[$user]($style)@'
style_user = 'warn'
style_root = 'bold err'

[hostname]
ssh_only = true
ssh_symbol = ' '
format = '[$ssh_symbol$hostname]($style) '
style = 'bold warn'

[directory]
style = 'bold accent'
read_only = ' 󰌾'
read_only_style = 'err'
# Repos live under ~/work/<name>, so five components keep the full path
# visible in the common case; deeper paths fall back to the last five with
# the repo root underlined when it is still on screen.
truncation_length = 5
truncate_to_repo = false
truncation_symbol = '…/'
repo_root_style = 'bold underline accent'

[git_branch]
symbol = ' '
style = 'bold vcs'
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_length = 32
truncation_symbol = '…'
# Detached-HEAD inside a bare checkout (worktrees) carries no branch to show.
ignore_bare_repo = true

[git_commit]
tag_symbol = '  '
only_detached = true
style = 'vcs'

[git_state]
style = 'bold warn'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = 'err'
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '='
untracked = '?${count}'
stashed = '*'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
# Submodule walks are the expensive part of git_status on a monorepo and
# never change what an agent needs to know at a glance.
ignore_submodules = true

[docker_context]
symbol = ' '
style = 'cloud'
# Only when a compose file or Dockerfile is in scope; the default shows the
# context in every directory once DOCKER_CONTEXT is set.
only_with_files = true

[kubernetes]
# Disabled upstream by default; cheap enough here because it only reads the
# kubeconfig, and the box runs docker, not a cluster, so it stays silent there.
disabled = false
symbol = '󱃾 '
style = 'cloud'
format = '[$symbol$context( \($namespace\))]($style) '
detect_files = ['k8s', 'kustomization.yaml', 'skaffold.yaml', 'Chart.yaml']
detect_folders = ['k8s', 'charts', 'manifests']

[aws]
symbol = ' '
style = 'cloud'
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
expiration_symbol = '(expired) '

[gcloud]
symbol = ' '
style = 'cloud'
format = '[$symbol$account(@$domain)(\($region\))]($style) '

[terraform]
symbol = ' '
style = 'cloud'
# Workspace name is the signal; the version lookup spawns terraform itself.
format = '[$symbol$workspace]($style) '

[python]
symbol = ' '
style = 'warn'
# A venv name says more than the interpreter version.
format = '[$symbol$pyenv_prefix($virtualenv )]($style)'
detect_extensions = []
detect_files = ['pyproject.toml', 'requirements.txt', '.python-version', 'Pipfile', 'setup.py']

[nodejs]
symbol = ' '
style = 'ok'
format = '[$symbol($version )]($style)'
detect_extensions = []
detect_files = ['package.json', '.node-version', '.nvmrc']

[golang]
symbol = ' '
style = 'cloud'
format = '[$symbol($version )]($style)'

[rust]
symbol = '󱘗 '
style = 'err'
format = '[$symbol($version )]($style)'

[direnv]
disabled = false
symbol = ' '
format = '[$symbol$loaded/$allowed]($style) '
style = 'muted'
allowed_msg = 'ok'
not_allowed_msg = 'blocked'
denied_msg = 'denied'
loaded_msg = 'on'
unloaded_msg = 'off'

[sudo]
disabled = false
symbol = '󰌋 '
format = '[$symbol]($style)'
style = 'bold err'

[jobs]
symbol = ' '
style = 'muted'
number_threshold = 1
symbol_threshold = 1
format = '[$symbol$number]($style) '

[cmd_duration]
min_time = 2000
format = '[ $duration]($style) '
style = 'muted'

[status]
disabled = false
symbol = ' '
not_executable_symbol = '󰂭 '
not_found_symbol = '󰍉 '
sigint_symbol = '󰟃 '
signal_symbol = '󱐋 '
map_symbol = true
pipestatus = true
pipestatus_separator = '|'
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style)'
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
style = 'bold err'

[time]
disabled = false
format = '[$time]($style)'
style = 'muted'
time_format = '%H:%M'

[character]
success_symbol = '[❯](bold ok)'
error_symbol = '[❯](bold err)'
vimcmd_symbol = '[❮](bold ok)'

[line_break]
disabled = false
