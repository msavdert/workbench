# ~/.config/mise/config.toml for the agent user. Managed by agent-vm/provision.
#
# apt owns the OS layer (docker, build tools, diagnostics); mise owns the
# per-user, fast-moving layer so `mise up` refreshes all of it at once.
# Claude Code is NOT here: it uses Anthropic's native installer and updates
# itself (see provision/bootstrap.sh step_tools).

[settings]
# Agents cannot answer y/n prompts.
yes = true
not_found_auto_install = false
# Keep tool binaries out of the way of project files.
paranoid = false

[tools]
node = "lts"
go = "latest"
bun = "latest"
# The registry short name "uv" resolved to a stale 0.4.x list (Aug 2026);
# the explicit aqua backend returns the real latest.
"aqua:astral-sh/uv" = "latest"
gh = "latest"
"1password-cli" = "latest"
yq = "latest"
shfmt = "latest"
usage = "latest"
"npm:@oh-my-pi/pi-coding-agent" = "latest"
