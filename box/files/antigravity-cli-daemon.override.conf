# Drop-in for the unit that `agy remote-control start` writes. That unit pins
# ExecStart to the versioned mise install directory
# (~/.local/share/mise/installs/agy/<version>/antigravity), which `mise up`
# followed by `mise prune` removes; the daemon would then fail on its next
# restart. Resolve the binary through mise on every start instead. The drop-in
# survives `agy remote-control stop`/`start` rewriting the unit.
[Service]
ExecStart=
ExecStart=/usr/bin/mise exec agy -- agy remote-control serve
