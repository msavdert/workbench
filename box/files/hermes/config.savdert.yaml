# Hermes config seed for the savdert user's family gateway. Installed only
# if ~/.hermes/config.yaml is absent; runtime-owned after that. The family
# install is browserless (--skip-browser) and fully isolated from the agent
# user's data: separate OS user, no vault clone, no 1Password token.
# Web search uses the keyless tier (no backend set = no API key needed).
model:
  provider: custom
  base_url: https://api.synthetic.new/openai/v1
  api_key: ${HERMES_CUSTOM_API_SYNTHETIC_NEW_API_KEY}
  default: syn:large:text
  vision: syn:large:vision
fallback_providers:
  - provider: custom
    base_url: https://api.synthetic.new/openai/v1
    key_env: HERMES_CUSTOM_API_SYNTHETIC_NEW_API_KEY
    model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
database:
  journal_mode: wal
agent:
  max_turns: 150
  reasoning_effort: medium
  verify_on_stop: false
terminal:
  backend: local
  cwd: .
  timeout: 180
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
tts:
  provider: edge
