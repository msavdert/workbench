# File watchers: vite/webpack/tsc --watch, many projects at once.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
# Elasticsearch/OpenSearch containers refuse to start below this.
vm.max_map_count = 262144
# We have a swapfile only as a safety net; prefer to keep pages in RAM.
vm.swappiness = 10
# Backlog for local dev servers under load tests.
net.core.somaxconn = 4096
